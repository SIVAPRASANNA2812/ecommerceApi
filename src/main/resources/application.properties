spring.application.name=ecommerceApi
spring.data.mongodb.auto-index-creation=true

# Read MongoDB URI with local fallback default
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ecommerceDb}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ecommerceDb}
spring.mongodb.database=${MONGODB_DATABASE:ecommerceDb}

# Read JWT Secret with fallback default for tests/local
jwt.secret=${JWT_SECRET:mySecretKeyForTestingECommerceApplication2026SecureKey123}
jwt.expiration=${JWT_EXPIRATION:86400000}